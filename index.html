<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#DA2017">
<title>شباب الملاك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#DA2017; --red-deep:#A8140D; --red-soft:#FBE6E3;
  --amber:#F5A623; --amber-deep:#D9870B; --amber-soft:#FDF0D9;
  --cream:#FBF6EE; --surface:#FFFFFF; --surface-2:#FFF9F1;
  --ink:#2B1512; --muted:#8C7B73; --line:rgba(43,21,18,.09);
  --green:#1E7A3D; --green-soft:#E9F6EC;
  --shadow:0 10px 30px -12px rgba(168,20,13,.22);
  --shadow-sm:0 4px 14px -8px rgba(43,21,18,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--cream);color:var(--ink);overscroll-behavior-y:none}
.app{
  max-width:480px;margin:0 auto;min-height:100vh;position:relative;
  background:
    radial-gradient(120% 60% at 80% -8%, rgba(245,166,35,.16), transparent 60%),
    radial-gradient(120% 55% at 0% 0%, rgba(218,32,23,.10), transparent 55%),
    var(--cream);
  padding-bottom:96px;
}
h1,h2,h3,h4,.brand{font-family:'Rubik',sans-serif}

.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;background:linear-gradient(var(--cream) 72%,transparent);backdrop-filter:blur(6px)}
.brandmark{display:flex;align-items:center;gap:9px}
.brandmark .dot{width:34px;height:34px;border-radius:50%;background:conic-gradient(from -40deg,var(--red),var(--amber),var(--red));display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 4px 10px -3px rgba(218,32,23,.5)}
.brandmark b{font-family:'Rubik';font-weight:800;font-size:17px;letter-spacing:.3px}
.pts-pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:7px 13px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:var(--shadow-sm);font-family:'Rubik'}
.pts-pill small{font-weight:500;font-family:'Tajawal';color:var(--muted);font-size:11px}
.pts-pill.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}

.screen{display:none;padding:6px 18px 0;animation:fade .35s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;font-weight:700;color:var(--red);letter-spacing:1px;text-transform:uppercase}
.h-title{font-size:25px;font-weight:800;margin:2px 0 16px;line-height:1.25}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-sm)}
.pad{padding:18px}

.hero{position:relative;overflow:hidden;border-radius:26px;padding:26px 20px 22px;margin-bottom:18px;background:linear-gradient(150deg,#fff,#FFF4E9);border:1px solid var(--line);box-shadow:var(--shadow);text-align:center}
.hero .logo-big{width:96px;height:96px;border-radius:50%;margin:2px auto 12px;display:grid;place-items:center;background:conic-gradient(from -40deg,var(--red),var(--amber),var(--red));box-shadow:0 10px 24px -8px rgba(218,32,23,.5);color:#fff;font-size:42px}
.hero h1{font-size:25px;font-weight:900;margin:0;letter-spacing:.5px}
.hero .sub{color:var(--muted);font-weight:500;margin-top:6px;font-size:13.5px;line-height:1.6}
.hero .tag{margin-top:12px;font-family:'Rubik';font-weight:700;color:var(--red);font-size:14px}
.week-chip{display:inline-block;margin-top:12px;background:var(--red-soft);color:var(--red-deep);font-weight:700;font-size:12.5px;padding:6px 14px;border-radius:999px}

.ring-card{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.ring-wrap{position:relative;flex:none}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--red-soft);stroke-width:9}
.ring-fg{fill:none;stroke:url(#grad);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring-label{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-label b{font-family:'Rubik';font-weight:800;font-size:20px;line-height:1}
.ring-label span{font-size:9.5px;color:var(--muted)}
.ring-text h3{margin:0 0 3px;font-size:17px;font-weight:800}
.ring-text p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
.sec-head h2{font-size:18px;font-weight:800;margin:0}
.sec-head a{font-size:13px;font-weight:700;color:var(--red);text-decoration:none;cursor:pointer}

.ev{display:flex;gap:13px;padding:15px;margin-bottom:11px}
.ev .ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:21px}
.ev .ic.mass{background:var(--amber-soft)}.ev .ic.youth{background:#E7F0FB}.ev .ic.study{background:var(--red-soft)}
.ev .body{flex:1;min-width:0}
.ev h3{margin:0;font-size:15.5px;font-weight:700;line-height:1.35}
.ev .topic{color:var(--muted);font-size:12.5px;margin-top:3px}
.ev .foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.ev .pts{font-weight:700;font-size:13px;color:var(--amber-deep)}
.btn{border:none;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;padding:9px 16px;border-radius:12px;transition:transform .12s,filter .2s}
.btn:active{transform:scale(.96)}
.btn-go{background:var(--red);color:#fff;box-shadow:0 6px 14px -6px rgba(218,32,23,.6)}
.btn-done{background:var(--green-soft);color:var(--green);cursor:default}
.btn-done::before{content:"✓ "}
.btn-pending{background:var(--amber-soft);color:var(--amber-deep);cursor:default}
.btn-pending::before{content:"⏳ "}
.ev.attended{border-color:rgba(30,122,61,.25);background:linear-gradient(#fff,#F4FBF6)}

.row{display:flex;align-items:center;gap:13px;padding:14px;margin-bottom:10px;cursor:pointer}
.row .av{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;font-family:'Rubik';font-weight:800;color:#fff;font-size:18px;background:linear-gradient(135deg,var(--red),var(--amber))}
.row .info{flex:1;min-width:0}
.row .info b{font-weight:700;font-size:15px;display:block}
.row .info span{color:var(--muted);font-size:13px}
.row .chev{color:var(--muted);font-size:18px}

.verse{background:linear-gradient(150deg,var(--red),var(--red-deep));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.verse::before{content:"”";position:absolute;font-size:130px;font-family:'Rubik';font-weight:900;opacity:.13;top:-30px;left:14px}
.verse .ref{font-family:'Rubik';font-weight:700;font-size:13px;color:var(--amber);margin-bottom:8px}
.verse p{font-size:16.5px;line-height:1.7;margin:0;font-weight:500}
.devo{margin-top:12px}
.devo h4{margin:0 0 6px;font-size:15px;font-weight:800}
.devo p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}

/* ---- stickers ---- */
.stk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px}
.stk{aspect-ratio:1;border-radius:16px;background:linear-gradient(150deg,#fff,var(--surface-2));border:1px solid var(--line);display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow-sm)}
.stk-empty{color:var(--muted);font-size:14px;line-height:1.7;background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center}
.me-card{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 15px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.me-av{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;font-family:'Rubik';font-weight:800;color:#fff;font-size:20px;background:linear-gradient(135deg,var(--red),var(--amber))}
.me-info b{display:block;font-size:16px;font-weight:800}
.me-info span{color:var(--muted);font-size:13px;direction:ltr;display:inline-block}
.hist{display:flex;gap:12px;padding:13px;margin-bottom:9px}
.hist .em{font-size:22px;flex:none}
.hist b{display:block;font-weight:700;font-size:14px}
.hist span{color:var(--muted);font-size:12px}

.subhead{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.subhead .back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;font-size:18px}
.subhead h2{margin:0;font-size:20px;font-weight:800}
.lyrics{white-space:pre-wrap;line-height:2;font-size:16px;font-weight:500}
.empty-note{color:var(--muted);font-size:14px;line-height:1.7;background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center}
.reset{margin:26px 2px 8px;text-align:center}
.reset button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:13px;text-decoration:underline;cursor:pointer}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;max-width:480px;margin:0 auto;display:flex;justify-content:space-around;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;background:none;border:none;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--muted)}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;font-weight:700}
.tab.on{color:var(--red)}
.tab.on svg{stroke:var(--red)}

.overlay{position:fixed;inset:0;z-index:60;background:rgba(43,21,18,.45);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:800}
.sheet .ev-name{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.sheet input{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;font-family:'Rubik';font-size:20px;font-weight:700;text-align:center;letter-spacing:3px;outline:none;text-transform:uppercase}
.sheet input:focus{border-color:var(--red)}
.sheet input.err{border-color:var(--red);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.err-msg{color:var(--red);font-size:13px;font-weight:700;margin-top:8px;min-height:18px;text-align:center}
.sheet .acts{display:flex;gap:10px;margin-top:8px}
.sheet .acts button{flex:1;padding:14px;border-radius:14px;font-weight:700;font-family:inherit;font-size:15px;border:none;cursor:pointer}
.sheet .cancel{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.sheet .confirm{background:var(--red);color:#fff}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}
.sticker-reveal{text-align:center;padding:10px 0}
.sticker-reveal .big{font-size:72px;line-height:1;margin-bottom:10px;animation:pop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.toast{position:fixed;bottom:108px;left:50%;transform:translateX(-50%) translateY(20px);z-index:70;background:var(--ink);color:#fff;padding:13px 22px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 12px 30px -8px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.3s;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .s{color:var(--amber)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.reg{position:fixed;inset:0;z-index:90;background:
  radial-gradient(120% 60% at 80% -8%,rgba(245,166,35,.18),transparent 60%),
  radial-gradient(120% 55% at 0% 0%,rgba(218,32,23,.12),transparent 55%),var(--cream);
  display:none;align-items:center;justify-content:center;padding:22px;overflow:auto}
.reg.open{display:flex;animation:fade .3s}
.reg-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:26px 22px;max-width:420px;width:100%;text-align:center}
.reg-card .logo-big{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:conic-gradient(from -40deg,var(--red),var(--amber),var(--red));box-shadow:0 10px 24px -8px rgba(218,32,23,.5);color:#fff;font-size:36px}
.reg-card h2{font-family:'Rubik';font-weight:900;font-size:22px;margin:0 0 4px}
.reg-card .lead{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0 0 18px}
.field{text-align:right;margin-bottom:13px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.field input{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-family:'Tajawal';font-size:16px;font-weight:500;outline:none;background:var(--surface-2)}
.field input:focus{border-color:var(--red);background:#fff}
.field.err input{border-color:var(--red)}
.reg-card .go-btn{width:100%;border:none;background:var(--red);color:#fff;font-family:inherit;font-weight:800;font-size:16px;padding:15px;border-radius:15px;cursor:pointer;margin-top:6px;box-shadow:0 8px 18px -7px rgba(218,32,23,.6)}
.reg-card .go-btn:active{transform:scale(.97)}
.reg-err{color:var(--red);font-weight:700;font-size:13px;min-height:16px;margin-top:8px}
.reg-card .priv{color:var(--muted);font-size:11.5px;line-height:1.6;margin-top:14px}

.qbanner{display:none;align-items:center;justify-content:space-between;gap:10px;margin:0 18px 14px;padding:11px 14px;background:var(--amber-soft);border:1px solid rgba(245,166,35,.4);border-radius:14px;cursor:pointer}
.qbanner.show{display:flex}
.qbanner .qleft{display:flex;align-items:center;gap:9px;min-width:0}
.qbanner .qdot{width:8px;height:8px;border-radius:50%;background:var(--amber-deep);flex:none;animation:qpulse 1.4s infinite}
@keyframes qpulse{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.qbanner .qtxt{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.5}
.qbanner .qtxt b{color:var(--amber-deep)}
.qbanner .qretry{flex:none;font-size:11.5px;font-weight:800;color:var(--amber-deep);background:#fff;border:1px solid rgba(245,166,35,.4);padding:5px 10px;border-radius:999px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brandmark"><span class="dot">م</span><b>شباب الملاك</b></div>
    <button class="pts-pill" onclick="go('stickers')"><small>نقاطك</small> <span id="pillPoints">0</span></button>
  </div>

  <div class="qbanner" id="qbanner" onclick="retryQueueNow()">
    <div class="qleft"><span class="qdot"></span><span class="qtxt" id="qbannerText"></span></div>
    <span class="qretry">حاول تاني</span>
  </div>

  <section class="screen active" id="screen-home"></section>
  <section class="screen" id="screen-stickers"></section>
  <section class="screen" id="screen-songs"></section>
  <section class="screen" id="screen-devo"></section>
  <section class="screen" id="screen-song"></section>

  <nav class="tabbar">
    <button class="tab on" data-tab="home" onclick="go('home')">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>الرئيسية</span></button>
    <button class="tab" data-tab="stickers" onclick="go('stickers')">
      <svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span>الستيكرز</span></button>
    <button class="tab" data-tab="songs" onclick="go('songs')">
      <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span>الترانيم</span></button>
  </nav>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div id="ciStep1">
      <h3>تسجيل الحضور</h3>
      <div class="ev-name" id="modalEv"></div>
      <input id="codeInput" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" data-lpignore="true" data-1p-ignore placeholder="——" maxlength="12" oninput="this.classList.remove('err')">
      <div class="err-msg" id="errMsg"></div>
      <div class="acts">
        <button class="cancel" onclick="closeModal()">إلغاء</button>
        <button class="confirm" onclick="submitCode()">تأكيد الحضور</button>
      </div>
      <div class="hint">الكود بيتقال في الاجتماع 🙏</div>
    </div>
    <div id="ciSticker" style="display:none">
      <div class="sticker-reveal">
        <div class="big" id="stickerBig">✝️</div>
        <h3>تم تسجيل حضورك ✅</h3>
        <div class="ev-name">ستيكر جديد اتضاف لمجموعتك!</div>
      </div>
      <div class="acts"><button class="confirm" style="flex:1" onclick="closeModal()">تمام ✦</button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="reg" id="reg">
  <div class="reg-card">
    <div class="logo-big">✝️</div>
    <h2>أهلاً بيك في شباب الملاك</h2>
    <p class="lead">سجّل اسمك ورقمك مرّة واحدة بس عشان نتابع حضورك ونقاطك وستيكراتك.</p>
    <div class="field" id="fName"><label>اسمك بالكامل</label><input id="regName" autocomplete="name" placeholder="اكتب اسمك"></div>
    <div class="field" id="fPhone"><label>رقم الموبايل</label><input id="regPhone" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx"></div>
    <div class="reg-err" id="regErr"></div>
    <button class="go-btn" onclick="doRegister()">يلا نبدأ ✦</button>
    <p class="priv">بياناتك بتتحفظ على موبايلك، وبتتزامن مع سجل الخدمة بأمان.</p>
  </div>
</div>
<svg width="0" height="0"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA2017"/><stop offset="1" stop-color="#F5A623"/></linearGradient></defs></svg>

<script>
/* ============================================================
   ⚙️  CONFIG — عدّل بياناتك من هنا
   ============================================================ */
const CONFIG = {
  name:"شباب الملاك",
  subtitle:"خدمة شباب كنيسة الملاك ميخائيل",
  tagline:"سوا في الطريق ✦",
  // 🔗 رابط الـ Apps Script بتاعك (.../exec) — من غيره التطبيق مش هيقدر يسجّل حضور
  sheetUrl:"",
  // 📅 لقاءات الأسبوع الثابتة — كل واحد كوده بيتغيّر كل أسبوع من Code.gs (WEEKLY_CODES)
  slots:[
    { id:"mass",  kind:"mass",  title:"القدّاس الإلهي",       topic:"خدمة القداس الأسبوعي", icon:"✝️", points:30 },
    { id:"youth", kind:"youth", title:"اجتماع الشباب",         topic:"لقاء الأسبوع",          icon:"🤝", points:20 },
    { id:"study", kind:"study", title:"دراسة الكتاب",          topic:"درس الأسبوع",           icon:"📖", points:20 },
  ],
  devotionals:[
    { ref:"يوحنا ٨ : ١٢", verse:"أنا هو نور العالم. مَن يتبعني فلا يمشي في الظلمة بل يكون له نور الحياة.",
      title:"نور كل أسبوع", body:"كل لقاء بيقرّبنا للنور. مش محطة بتخلص، لكن مشوار مستمر كل أسبوع من جديد." },
    { ref:"مزمور ١١٩ : ١٠٥", verse:"سراج لرجلي كلامك، ونور لسبيلي.",
      title:"كلمته نور", body:"دراسة الكتاب مش معلومات بنجمعها، لكنها سراج بينوّر الطريق قدّامنا خطوة بخطوة." },
  ],

     ألزق الكلمات انت بنفسك من مصدر عندك حق استخدامه (كتاب ترانيم الكنيسة، أو موقع رسمي). */

/* ============================================================
   ⬇️  الكود الأساسي
   ============================================================ */
const SLOTMAP = {}; CONFIG.slots.forEach(s=>SLOTMAP[s.id]=s);
const kindLabel = {mass:"قدّاس", youth:"اجتماع شباب", study:"دراسة كتاب"};

/* ---- storage ---- */
const KEY_U="mikhail_user_v1", KEY_Q="mikhail_queue_v1";
let USER={ name:"", phone:"", points:0, count:0, stickers:[], weekDone:{}, weekKey:"", notices:[] };
let queue=[];
let processingQueue=false;
function load(){ try{
  let u=localStorage.getItem(KEY_U); if(u) USER=Object.assign(USER,JSON.parse(u));
  let q=localStorage.getItem(KEY_Q); if(q) queue=JSON.parse(q)||[];
}catch(e){} }
function save(){ try{ localStorage.setItem(KEY_U,JSON.stringify(USER)); }catch(e){} }
function saveQueue(){ try{ localStorage.setItem(KEY_Q,JSON.stringify(queue)); }catch(e){} }
function pushNotice(text){ if(!USER.notices) USER.notices=[]; USER.notices.unshift({text,at:new Date().toISOString()}); USER.notices=USER.notices.slice(0,20); save(); }
function clearNotices(){ USER.notices=[]; save(); refreshActive(); }
load();

/* ---- jsonp (بيبعت الكود للسيرفر ويستنى الرد، بيفشل لو مفيش نت) ---- */
function jsonp(params){
  return new Promise((resolve, reject)=>{
    if(!CONFIG.sheetUrl){ reject('no-url'); return; }
    const cbName='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
    const s=document.createElement('script');
    let done=false;
    function cleanup(){ delete window[cbName]; if(s.parentNode) s.parentNode.removeChild(s); }
    window[cbName]=function(data){ done=true; cleanup(); resolve(data); };
    const qs=new URLSearchParams(Object.assign({},params,{callback:cbName})).toString();
    s.src=CONFIG.sheetUrl+'?'+qs;
    s.onerror=()=>{ if(!done){ cleanup(); reject('network'); } };
    document.body.appendChild(s);
    setTimeout(()=>{ if(!done){ cleanup(); reject('timeout'); } }, 12000);
  });
}

/* ---- طابور الأوفلاين ---- */
function isPending(slotId){ return queue.some(q=>q.slot===slotId); }
function queueAdd(item){ item.qid='q'+Date.now()+Math.floor(Math.random()*1000); item.attempts=0; queue.push(item); saveQueue(); renderQueueBanner(); }
function queueRemoveQid(qid){ queue=queue.filter(q=>q.qid!==qid); saveQueue(); }
function renderQueueBanner(){
  const b=document.getElementById('qbanner'); if(!b) return;
  if(!queue.length){ b.classList.remove('show'); return; }
  document.getElementById('qbannerText').innerHTML=`<b>${queue.length}</b> حضور في انتظار النت — هيتأكد لوحده`;
  b.classList.add('show');
}
function applyAttendSuccess(st){
  USER.points=st.points; USER.count=st.count; USER.stickers=st.stickers||[]; USER.weekDone=st.weekDone||{}; USER.weekKey=st.weekKey||USER.weekKey;
  save();
}
async function processQueue(){
  if(!queue.length || processingQueue) return;
  processingQueue=true;
  let changed=false;
  const items=[...queue];
  for(const item of items){
    if(!queue.find(q=>q.qid===item.qid)) continue;
    let res=null, offline=false;
    try{ res=await jsonp({ action:'attend', phone:item.phone, name:item.name, slot:item.slot, code:item.code }); }
    catch(err){ offline=true; }
    item.attempts=(item.attempts||0)+1;
    if(offline){
      if(item.attempts>=30){ queueRemoveQid(item.qid); changed=true; pushNotice(`⚠️ ماقدرناش نتأكد من حضور «${kindLabel[SLOTMAP[item.slot]?.kind]||item.slot}» — سجّله تاني لو سمحت`); }
      continue;
    }
    queueRemoveQid(item.qid); changed=true;
    if(!res || res.valid!==true){
      pushNotice(res && res.already ? `ℹ️ كنت مسجّل حضور «${(SLOTMAP[item.slot]||{}).title||item.slot}» الأسبوع ده فعلاً` : `❌ الكود اللي اتسجّل لـ «${(SLOTMAP[item.slot]||{}).title||item.slot}» طلع غلط — سجّله تاني`);
      continue;
    }
    applyAttendSuccess(res);
    toast(`✅ اتأكّد حضورك في «${(SLOTMAP[item.slot]||{}).title||item.slot}» — ستيكر جديد ${res.sticker||''}`);
  }
  processingQueue=false;
  renderQueueBanner();
  if(changed){ updatePill(); refreshActive(); }
}
function retryQueueNow(){ if(queue.length){ toast('بيحاول يتأكد من النت…'); processQueue(); } }

/* ---- مزامنة الحالة من السيرفر — بتتنادى كل ما تفتح الرئيسية عشان "تم الحضور" ميفضلش
   من أسبوع فات بعد ما الأسبوع يتجدّد (weekDone بيتحسب على السيرفر بالتاريخ الحالي) */
async function syncState(){
  if(!USER.phone) return;
  try{
    const st=await jsonp({action:'state', phone:USER.phone});
    if(st && st.found){ applyAttendSuccess(st); updatePill(); refreshActive(); }
  }catch(e){}
}
/* ---- nav ---- */
function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  const prim=['home','stickers','songs'];
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===name));
  if(!prim.includes(name)) document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  render(name); window.scrollTo(0,0);
  if(name==='home' || name==='stickers') syncState();
}
function render(name){
  const map={home:homeHTML, stickers:stickersHTML, songs:songsHTML, devo:devoHTML};
  if(map[name]) document.getElementById('screen-'+name).innerHTML=map[name]();
}
function refreshActive(){ const a=[...document.querySelectorAll('.screen.active')][0]; if(a) render(a.id.replace('screen-','')); }

/* ---- HOME ---- */
function homeHTML(){
  const dv=CONFIG.devotionals[0];
  return `
  <div class="hero">
    <div class="logo-big">✝️</div>
    <h1>${CONFIG.name}</h1>
    <div class="sub">${CONFIG.subtitle}</div>
    <div class="tag">${CONFIG.tagline}</div>
    <div class="week-chip">لقاءات الأسبوع</div>
  </div>

  <div class="sec-head"><h2>حضّر النهاردة</h2></div>
  ${CONFIG.slots.map(slotCard).join('')}

  <div class="sec-head"><h2>آية اليوم</h2><a onclick="go('devo')">تأملات ›</a></div>
  <div class="verse"><div class="ref">${dv.ref}</div><p>${dv.verse}</p></div>
  `;
}
function slotCard(s){
  const done=!!(USER.weekDone && USER.weekDone[s.id]);
  const pend=!done && isPending(s.id);
  return `<div class="card ev ${done?'attended':''}">
    <div class="ic ${s.kind}">${s.icon}</div>
    <div class="body"><h3>${s.title}</h3><div class="topic">${s.topic||''}</div>
      <div class="foot"><span class="pts">✦ ${s.points||0} نقطة</span>
        ${done?`<button class="btn btn-done">تم الحضور</button>`:pend?`<button class="btn btn-pending">قيد التأكيد</button>`:`<button class="btn btn-go" onclick="openModal('${s.id}')">تسجيل الحضور</button>`}</div>
    </div></div>`;
}

function stickersHTML(){
  const list=(USER.stickers||[]).slice().reverse();
  return `<div class="eyebrow">نقاطك</div><h1 class="h-title">${USER.name?('أهلاً '+USER.name.split(' ')[0]+' 👋'):'مجموعة ستيكراتك'}</h1>
    <div class="me-card"><div class="me-av">${(USER.name.trim()[0]||'ش')}</div>
      <div class="me-info"><b>${USER.name||'—'}</b><span>${USER.phone||''}</span></div></div>
    <div class="card pad" style="margin-bottom:16px;text-align:center">
      <div style="display:flex;justify-content:space-around">
        <div><b style="font-family:'Rubik';font-weight:800;font-size:22px;display:block">${USER.points||0}</b><span style="color:var(--muted);font-size:12px">نقطة</span></div>
        <div><b style="font-family:'Rubik';font-weight:800;font-size:22px;display:block">${(USER.stickers||[]).length}</b><span style="color:var(--muted);font-size:12px">ستيكر</span></div>
        <div><b style="font-family:'Rubik';font-weight:800;font-size:22px;display:block">${USER.count||0}</b><span style="color:var(--muted);font-size:12px">حضور</span></div>
      </div>
    </div>
    <div class="sec-head"><h2>مجموعة الستيكرز</h2></div>
    ${list.length? `<div class="stk-grid">${list.map(s=>`<div class="stk">${s.sticker}</div>`).join('')}</div>`
      : `<div class="stk-empty">لسه مفيش ستيكرز — حضّر أي لقاء وهيتضاف ستيكر لمجموعتك 🎉</div>`}
    ${list.length? `<div class="sec-head"><h2>سجل الحضور</h2></div>
      ${list.slice(0,20).map(s=>`<div class="card hist"><div class="em">${s.sticker}</div><div><b>${(SLOTMAP[s.slot]||{}).title||s.slot}</b><span>${s.week||''}</span></div></div>`).join('')}`:''}
    ${(USER.notices&&USER.notices.length)?`<div class="sec-head"><h2>🔔 تنبيهات المزامنة</h2><a onclick="clearNotices()">مسح ›</a></div>
      ${USER.notices.map(n=>`<div class="card hist"><div class="em">⚠️</div><div><b>${n.text}</b></div></div>`).join('')}`:''}
    <div class="reset"><button onclick="resetAll()">تصفير بيانات الموبايل ده</button></div>`;
}

/* ---- SONGS ---- */
function songsHTML(){
  return `<div class="eyebrow">الترانيم</div><h1 class="h-title">نسبّح مع بعض 🎵</h1>
    ${CONFIG.songs.map((s,i)=>`<div class="card row" onclick="openSong(${i})"><div class="av">♪</div>
      <div class="info"><b>${s.title}</b><span>${s.artist||'اضغط لعرض الكلمات'}</span></div><div class="chev">‹</div></div>`).join('')}`;

function openSong(i){
  const s=CONFIG.songs[i];
  document.getElementById('screen-song').innerHTML=`<div class="subhead"><button class="back" onclick="go('songs')">›</button><h2>${s.title}</h2></div>
    ${s.lyrics?`<div class="card pad lyrics">${s.lyrics}</div>`:`<div class="empty-note">كلمات الترنيمة لسه مش مضافة.<br>أضفها من قسم <b>songs</b> في الإعدادات.</div>`}`;

function devoHTML(){
  return `<div class="subhead"><button class="back" onclick="go('home')">›</button><h2>آيات وتأملات</h2></div>
    ${CONFIG.devotionals.map(d=>`<div style="margin-bottom:16px"><div class="verse"><div class="ref">${d.ref}</div><p>${d.verse}</p></div>
      <div class="card pad devo"><h4>${d.title}</h4><p>${d.body}</p></div></div>`).join('')}`;

/* ---- check-in modal ---- */
let pendingSlot=null;
function openModal(slotId){
  const s=SLOTMAP[slotId]; if(!s) return;
  pendingSlot=slotId;
  document.getElementById('ciSticker').style.display='none';
  document.getElementById('ciStep1').style.display='block';
  document.getElementById('modalEv').textContent=`${kindLabel[s.kind]||''} — ${s.title}`;
  const inp=document.getElementById('codeInput'); inp.value=''; inp.classList.remove('err');
  inp.setAttribute('name','mk_'+Date.now()+Math.floor(Math.random()*1e4));
  document.getElementById('errMsg').textContent='';
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>inp.focus(),250);
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); pendingSlot=null; const inp=document.getElementById('codeInput'); if(inp) inp.value=''; }
async function submitCode(){
  const s=SLOTMAP[pendingSlot]; if(!s) return;
  const inp=document.getElementById('codeInput');
  const val=inp.value.trim().toUpperCase();
  const errEl=document.getElementById('errMsg');
  const btn=document.querySelector('#overlay .confirm');
  if(!val){ inp.classList.add('err'); errEl.textContent='اكتب الكود الأول'; return; }
  if(btn){ btn.disabled=true; btn.textContent='بتأكّد…'; }
  errEl.textContent='';
  let res=null, offline=false;
  try{ res=await jsonp({ action:'attend', phone:USER.phone||'', name:USER.name||'', slot:s.id, code:val }); }
  catch(err){ offline=true; }
  if(btn){ btn.disabled=false; btn.textContent='تأكيد الحضور'; }
  if(offline){
    queueAdd({ slot:s.id, code:val, phone:USER.phone||'', name:USER.name||'' });
    closeModal();
    toast('مفيش نت دلوقتي 📶<br>هيتسجّل حضورك تلقائي أول ما الاتصال يرجع');
    refreshActive();
    return;
  }
  if(!res){ inp.classList.add('err'); errEl.textContent='في مشكلة، جرّب تاني'; return; }
  if(res.already===true){ inp.classList.add('err'); errEl.textContent='انت مسجّل حضور اللقاء ده الأسبوع ده فعلاً'; return; }
  if(res.valid!==true){ inp.classList.add('err'); errEl.textContent='الكود غير صحيح — اسأل المسؤول'; return; }
  applyAttendSuccess(res);
  updatePill(); bumpPill(); refreshActive();
  document.getElementById('ciStep1').style.display='none';
  document.getElementById('stickerBig').textContent=res.sticker||'✝️';
  document.getElementById('ciSticker').style.display='block';
}

/* ---- pill + toast ---- */
function updatePill(){ document.getElementById('pillPoints').textContent=USER.points||0; }
function bumpPill(){ const p=document.querySelector('.pts-pill'); if(!p) return; p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); }
let toastTimer;
function toast(html){ const t=document.getElementById('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }
function resetAll(){ if(confirm('متأكد إنك عايز تمسح كل بياناتك من على الموبايل ده؟')){ USER={ name:"", phone:"", points:0, count:0, stickers:[], weekDone:{}, weekKey:"", notices:[] }; save(); showReg(); } }

/* ---- registration ---- */
function showReg(){ document.getElementById('reg').classList.add('open'); setTimeout(()=>document.getElementById('regName').focus(),300); }
async function doRegister(){
  const name=document.getElementById('regName').value.trim();
  const phone=document.getElementById('regPhone').value.trim();
  const err=document.getElementById('regErr');
  document.getElementById('fName').classList.remove('err');
  document.getElementById('fPhone').classList.remove('err');
  if(name.length<2){ document.getElementById('fName').classList.add('err'); err.textContent='اكتب اسمك بالكامل'; return; }
  if(!/^[0-9+\-\s]{8,}$/.test(phone)){ document.getElementById('fPhone').classList.add('err'); err.textContent='اكتب رقم موبايل صحيح'; return; }
  USER.name=name; USER.phone=phone; save();
  try{ await jsonp({ action:'register', phone, name }); }catch(e){}
  document.getElementById('reg').classList.remove('open');
  go('home');
  try{
    const st=await jsonp({action:'state', phone});
    if(st && st.found){ const had=(st.count||0)>0; applyAttendSuccess(st); updatePill(); refreshActive(); if(had) toast('🎉 لقينا حسابك القديم ورجّعنا نقاطك وستيكراتك تلقائي'); }
  }catch(e){}
}

/* ---- init ---- */
if(!USER.phone) showReg();
updatePill(); render('home');
renderQueueBanner();
if(queue.length) setTimeout(processQueue, 1200);
window.addEventListener('online', ()=>{ if(queue.length) processQueue(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && queue.length) processQueue(); });
setInterval(()=>{ if(queue.length) processQueue(); }, 20000);
if(USER.phone) syncState();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
